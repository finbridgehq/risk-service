[project]
name = "vankoo-risk-service"
version = "0.1.0"
description = "Vankoo Risk Service API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.122",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pydantic-settings>=2.6",
    "aiokafka>=0.14.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "openai>=3.31.0",
    "pyhanko>=0.38",
    "pypdf>=6.21",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "types-openpyxl>=3.1.5.20260827",
]

# An application, not a library: install its dependencies, never the project itself.
# The directories next to main.py are bounded contexts, not packages to distribute.
[tool.uv]
package = false

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
# The local alembic/ directory would otherwise make the package look first-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", ".agents/"]

# aiokafka ships no type information; its classes are typed as Any here.
[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

# Neither does asn1crypto, the certificate parser pyHanko is built on.
[[tool.mypy.overrides]]
module = ["asn1crypto", "asn1crypto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
