name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    env:
      # Los tests usan dobles en memoria: esta URL nunca se conecta.
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      # setup-uv no publica etiqueta de versión mayor (v10): se fija la exacta.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy --strict)
        run: uv run mypy .

      - name: Tests (pytest)
        run: uv run pytest

      - name: Migrations render (offline SQL)
        run: uv run alembic upgrade head --sql > /dev/null
